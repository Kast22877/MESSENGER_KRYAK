name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build_apk
  cancel-in-progress: true

jobs:
  build_apk:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/free_up_space

      - name: Install Flutter
        run: |
          FLUTTER_VERSION=$(python3 -c "import json; print(json.load(open('.fvmrc'))['flutter'])")
          echo "Flutter $FLUTTER_VERSION"
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - name: Check tools
        run: |
          flutter --version
          java -version
          which keytool

      - uses: dtolnay/rust-toolchain@stable

      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          cd android
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 --decode > key.jks
            PASS="$ANDROID_KEY_PASS"
          else
            PASS=temporarypass
            keytool -genkeypair -v -keystore key.jks -alias key -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=KRYAK"
          fi
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=key\nstoreFile=../key.jks\n" "$PASS" "$PASS" > key.properties

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v7
        with:
          name: KRYAK-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30
