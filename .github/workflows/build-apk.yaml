name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build_apk
  cancel-in-progress: true

jobs:
  build_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          cd android
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "$ANDROID_KEYSTORE" | base64 --decode > key.jks
            PASS="$ANDROID_KEY_PASS"
          else
            PASS=temporarypass
            keytool -genkeypair -v -keystore key.jks -alias key -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Messenger"
          fi
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=key\nstoreFile=../key.jks\n" "$PASS" "$PASS" > key.properties

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: messenger-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30
